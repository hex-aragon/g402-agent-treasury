x-mainnet-locks: &mainnet-locks
  G402_ALLOW_MAINNET: "false"
  X402_ALLOW_EVM_MAINNET: "false"
  X402_ENABLE_EVM_MAINNET_SETTLEMENT: "false"
  X402_ALLOW_SOLANA_MAINNET: "false"
  X402_ENABLE_SOLANA_MAINNET_SETTLEMENT: "false"
  AKASH_ALLOW_MAINNET: "false"
  FILECOIN_ALLOW_MAINNET: "false"
  COSMOS_ALLOW_MAINNET: "false"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: g402
      POSTGRES_PASSWORD: g402-local-only
      POSTGRES_DB: g402
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g402 -d g402"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["g402-postgres:/var/lib/postgresql/data"]

  migrate:
    build: {context: ".", dockerfile: Dockerfile.worker}
    init: true
    restart: "no"
    environment:
      DATABASE_URL: postgres://g402:g402-local-only@postgres:5432/g402
    depends_on:
      postgres: {condition: service_healthy}
    command: ["node", "--import", "tsx", "scripts/migrate.ts"]

  web:
    build: {context: ".", dockerfile: Dockerfile.web}
    init: true
    restart: unless-stopped
    env_file: [.env.local]
    environment:
      <<: *mainnet-locks
      DATABASE_URL: postgres://g402:g402-local-only@postgres:5432/g402
      G402_ENABLE_SETTLEMENT: "false"
      INDEXER_MODE: persistent
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  indexer:
    build: {context: ".", dockerfile: Dockerfile.worker}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    env_file: [.env.local]
    environment:
      <<: *mainnet-locks
      DATABASE_URL: postgres://g402:g402-local-only@postgres:5432/g402
      GNO_NETWORK_ID: gno:pearl-1
      GNO_CHAIN_ID: pearl-1
      INDEXER_MODE: persistent
    depends_on:
      migrate: {condition: service_completed_successfully}

  akash-worker:
    build: {context: ".", dockerfile: Dockerfile.akash-worker}
    env_file: [.env.local]
    environment:
      <<: *mainnet-locks
      DATABASE_URL: postgres://g402:g402-local-only@postgres:5432/g402
    depends_on:
      migrate: {condition: service_completed_successfully}
    profiles: ["akash-live"]

  filecoin-worker:
    build: {context: ".", dockerfile: Dockerfile.filecoin-worker}
    env_file: [.env.local]
    environment:
      <<: *mainnet-locks
      DATABASE_URL: postgres://g402:g402-local-only@postgres:5432/g402
    depends_on:
      migrate: {condition: service_completed_successfully}
    profiles: ["filecoin-live"]

volumes:
  g402-postgres:
